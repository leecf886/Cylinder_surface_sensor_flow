[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cylinder-flow"
version = "0.1.0"
description = "Physics-informed surface sensor flow reconstruction for 2D cylinder wake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0,<2.6",
    "numpy>=1.24,<2.3",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-image>=0.20",
]

[project.scripts]
cylinder-flow = "cylinder_flow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
